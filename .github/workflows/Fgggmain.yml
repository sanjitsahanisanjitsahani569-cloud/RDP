Name: Windows 11 on Docker with Tailscale

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM Virtualization
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo adduser $USER libvirt
          sudo adduser $USER kvm
          kvm-ok || echo "KVM not supported, but continuing anyway..."

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup Windows Container
        run: |
          mkdir -p storage
          cat > docker-compose.yml <<EOF
          services:
            windows:
              image: dockurr/windows
              container_name: windows
              environment:
                VERSION: "11"
                RAM_SIZE: "6G"
                CPU_CORES: "2"
              devices:
                - /dev/kvm
              cap_add:
                - NET_ADMIN
              ports:
                - "8006:8006"
                - "3389:3389/tcp"
              volumes:
                - ./storage:/storage
              restart: always
          EOF
          docker compose up -d

      - name: Connection Details
        run: |
          # Cloudflare Tunnels start karein
          nohup cloudflared tunnel --url http://localhost:8006 > web.log 2>&1 &
          nohup cloudflared tunnel --url tcp://localhost:3389 > rdp.log 2>&1 &
          
          echo "Waiting for links and Tailscale IP..."
          sleep 30
          
          echo "=============================================="
          echo "🛡️ TAILSCALE CONNECTION (Recommended):"
          echo "Your Tailscale IP: $(tailscale ip -4)"
          echo "Use this IP in your RDP client (Port: 3389)"
          echo "----------------------------------------------"
          echo "🌍 CLOUDFLARE WEB CONSOLE:"
          grep -o "https://[a-zA-Z0-9.-]*\.trycloudflare\.com" web.log | head -n 1
          echo "----------------------------------------------"
          echo "🖥️ CLOUDFLARE RDP LINK:"
          grep -o "tcp://[a-zA-Z0-9.-]*\.trycloudflare\.com:[0-9]*" rdp.log | head -n 1
          echo "=============================================="
          
          # 6 ghante tak active rakhne ke liye
          sleep 21600
