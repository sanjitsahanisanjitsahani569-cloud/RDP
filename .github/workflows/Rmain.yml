name: Windows 11 on Docker

on: 
  workflow_dispatch: # Allows you to start it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup Windows Container
        run: |
          mkdir -p storage
          cat > docker-compose.yml <<EOF
          version: "3.9"
          services:
            windows:
              image: dockurr/windows
              container_name: windows
              environment:
                VERSION: "11"
                RAM_SIZE: "6G"
                CPU_CORES: "2"
              devices:
                - /dev/kvm
              cap_add:
                - NET_ADMIN
              ports:
                - "8006:8006"
                - "3389:3389/tcp"
              volumes:
                - ./storage:/storage
              restart: always
          EOF
          docker-compose up -d

      - name: Start Tunnel and Display Links
        run: |
          echo "Starting Cloudflare Tunnels..."
          nohup cloudflared tunnel --url http://localhost:8006 > web.log 2>&1 &
          nohup cloudflared tunnel --url tcp://localhost:3389 > rdp.log 2>&1 &
          sleep 15
          echo "=============================================="
          echo "🌍 WEB CONSOLE LINK:"
          grep -o "https://[a-zA-Z0-9.-]*\.trycloudflare\.com" web.log | head -n 1
          echo "----------------------------------------------"
          echo "🖥️ RDP TCP LINK:"
          grep -o "tcp://[a-zA-Z0-9.-]*\.trycloudflare\.com:[0-9]*" rdp.log | head -n 1
          echo "=============================================="
          echo "Keep-alive: This action will run for 6 hours."
          sleep 21600
